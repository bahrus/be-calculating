<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 1a</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc src="be-calculating/🧮.json"></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <form>
        <input type="range" id="a" value="50">
        +<input type="number" id="b" value="25">
        =<output for="a b" 🧮=+></output>
    </form>
    <div id=target></div>
    <script>
        function runScript(){
            const output = document.querySelector('output');
            if(output.value === '75'){
                target.setAttribute('mark', 'good');
            }
        }
        setTimeout(() => {
            runScript();
        }, 500);
    </script>
</body>
</html>
