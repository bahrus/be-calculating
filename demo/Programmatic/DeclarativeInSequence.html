<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic declarative in sequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <form>
        <input type=range id=a value=50>
        +<input type=number id=b value=25>
        =<output id=output></output>
    </form>
    <script type=module>
        import {defBeCalculating} from '/def.js';
        await defBeCalculating(document.body);
        // equivalent to <output for="a b" be-calculating=+>
        // only the first call needs to use .set -- it triggers the attachment.
        output.enh.set.beCalculating.forAttr = ['a', 'b'];
        output.enh.beCalculating.handler = '+';
    </script>
</body>
</html>
