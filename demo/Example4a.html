<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 4a</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    
    <input id=domain value=emojipedia.org>
    <input id=search value=calculator>
    <a id=link 🧮 🧮-for="#domain #search">
        Emoji link
    </a>
    <script>
        link.addEventListener('🧮', e => e.r = `https://${e.f.domain}/search?q=${e.f.search}`)
    </script>

    <script type=module>
        import '/🧮.js'
    </script>

</body>
</html>
