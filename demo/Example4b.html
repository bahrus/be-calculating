<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 4b - Full Element Access</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc src="be-calculating/🧮.json"></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <form>
        <input type="range" id="a" value="50">
        +<input type="number" id="b" value="25">
        =<output id=output for="a b" 🧮 🧮-raw></output>
        <script>
            output.addEventListener('🧮', e => e.r = e.f.a.valueAsNumber + e.f.b.valueAsNumber);
        </script>
    </form>
</body>
</html>
